services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: airo_xpress
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airo_xpress"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL:?Set APP_URL to the canonical application URL}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}@db:5432/airo_xpress?schema=public"
      DIRECT_URL: "postgresql://postgres:${POSTGRES_PASSWORD:?Set a unique POSTGRES_PASSWORD}@db:5432/airo_xpress?schema=public"
      APP_URL: ${APP_URL:?Set APP_URL to the canonical application URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      META_CAPI_GRAPH_API_VERSION: ${META_CAPI_GRAPH_API_VERSION:-}
      META_CAPI_TEST_EVENT_CODE: ${META_CAPI_TEST_EVENT_CODE:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      BKASH_APP_KEY: ${BKASH_APP_KEY:-}
      BKASH_APP_SECRET: ${BKASH_APP_SECRET:-}
      BKASH_USERNAME: ${BKASH_USERNAME:-}
      BKASH_PASSWORD: ${BKASH_PASSWORD:-}
      NAGAD_MERCHANT_ID: ${NAGAD_MERCHANT_ID:-}
      NAGAD_MERCHANT_PRIVATE_KEY: ${NAGAD_MERCHANT_PRIVATE_KEY:-}
      SSL_COMMERZ_STORE_ID: ${SSL_COMMERZ_STORE_ID:-}
      SSL_COMMERZ_STORE_PASSWORD: ${SSL_COMMERZ_STORE_PASSWORD:-}
    command: ["sh", "-c", "npm run db:deploy && npm run start"]
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres_data:
